<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Zenstier fleet mesh">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="45%"  stop-color="#111c33"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="55%"  stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e0f2fe"/>
      <stop offset="55%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.55"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="800" fill="url(#sky)"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <rect width="600" height="800" fill="url(#glow)"/>

  <!-- orbital rings around the control plane -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <circle cx="300" cy="330" r="118" opacity="0.16" stroke-width="1.5"/>
    <circle cx="300" cy="330" r="176" opacity="0.10" stroke-width="1.5"/>
    <circle cx="300" cy="330" r="234" opacity="0.06" stroke-width="1.5"/>
    <circle cx="300" cy="330" r="118" opacity="0.55" stroke-width="2.5"
            stroke-dasharray="8 336" stroke-dashoffset="-40"/>
    <circle cx="300" cy="330" r="176" opacity="0.40" stroke-width="2.5"
            stroke-dasharray="8 500" stroke-dashoffset="-220"/>
  </g>

  <!-- links from the control plane to each managed device -->
  <g stroke="url(#edge)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 356 C300 430 196 452 150 494"/>
    <path d="M300 356 C300 430 404 452 450 494"/>
    <path d="M300 356 C300 470 300 520 300 566"/>
    <path d="M300 344 C232 352 150 300 108 262"/>
    <path d="M300 344 C368 352 450 300 492 262"/>
  </g>

  <!-- data in flight -->
  <g fill="#bae6fd" filter="url(#tight)">
    <circle cx="214" cy="437" r="3.4" opacity="0.95"/>
    <circle cx="386" cy="437" r="3.4" opacity="0.8"/>
    <circle cx="300" cy="486" r="3.4" opacity="0.9"/>
    <circle cx="176" cy="312" r="3"   opacity="0.7"/>
    <circle cx="424" cy="312" r="3"   opacity="0.6"/>
  </g>

  <!-- control plane: shield -->
  <g filter="url(#soft)">
    <path d="M300 250 l46 21 v33 c0 30-19 51-46 60-27-9-46-30-46-60v-33z"
          fill="url(#hub)" opacity="0.96"/>
    <path d="M283 315 l12 12 23-25" fill="none" stroke="#0b1220"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- managed devices -->
  <g>
    <g transform="translate(150 494)">
      <rect x="-30" y="-20" width="60" height="40" rx="7"
            fill="#0f2038" stroke="#38bdf8" stroke-width="2.2"/>
      <rect x="-20" y="-10" width="40" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
      <rect x="-20" y="-1"  width="28" height="4" rx="2" fill="#38bdf8" opacity="0.5"/>
      <circle cx="18" cy="9" r="3.6" fill="#34d399"/>
    </g>
    <g transform="translate(450 494)">
      <rect x="-30" y="-20" width="60" height="40" rx="7"
            fill="#0f2038" stroke="#38bdf8" stroke-width="2.2"/>
      <rect x="-20" y="-10" width="40" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
      <rect x="-20" y="-1"  width="28" height="4" rx="2" fill="#38bdf8" opacity="0.5"/>
      <circle cx="18" cy="9" r="3.6" fill="#34d399"/>
    </g>
    <g transform="translate(300 566)">
      <rect x="-30" y="-20" width="60" height="40" rx="7"
            fill="#0f2038" stroke="#38bdf8" stroke-width="2.2"/>
      <rect x="-20" y="-10" width="40" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
      <rect x="-20" y="-1"  width="28" height="4" rx="2" fill="#38bdf8" opacity="0.5"/>
      <circle cx="18" cy="9" r="3.6" fill="#34d399"/>
    </g>
    <g transform="translate(108 262)" opacity="0.75">
      <rect x="-24" y="-16" width="48" height="32" rx="6"
            fill="#0f2038" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="14" cy="7" r="3" fill="#34d399"/>
    </g>
    <g transform="translate(492 262)" opacity="0.75">
      <rect x="-24" y="-16" width="48" height="32" rx="6"
            fill="#0f2038" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="14" cy="7" r="3" fill="#fbbf24"/>
    </g>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="300" y="688" fill="#f0f9ff" font-size="38" font-weight="600" letter-spacing="10">ZENSTIER</text>
    <text x="300" y="718" fill="#7dd3fc" font-size="14" letter-spacing="4.5" opacity="0.85">REMOTE FLEET MANAGEMENT</text>
    <text x="300" y="752" fill="#64748b" font-size="12.5" letter-spacing="1.6">Token-gated enrollment · mTLS transport · full audit trail</text>
  </g>
</svg>
