# ── Zenstier Mosquitto — DEVELOPMENT ────────────────────────────────────────
# Image: eclipse-mosquitto:2.1.2-alpine
# Dynamic Security is used so that revoking a device kicks its LIVE session.

# ---- Global ----
allow_anonymous false
allow_zero_length_clientid false

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60
autosave_on_changes false

# QoS 1 command/result flow control
max_inflight_messages 20
max_queued_messages 100
max_queued_bytes 10485760
queue_qos0_messages false
upgrade_outgoing_qos false

persistent_client_expiration 7d

# 256 KiB payload cap. Larger command output is uploaded over HTTPS instead.
message_size_limit 262144
max_packet_size 1048576

retain_available true
retain_expiry_interval 43200
sys_interval 10
max_keepalive 300

# ---- Logging ----
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---- Dynamic Security ----
# The JSON store must live on a WRITABLE volume: the plugin rewrites it on
# every credential change.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ---- Listener: container-local admin + healthcheck only ----
listener 1883 127.0.0.1
protocol mqtt
max_connections 20

# ---- Listener: MQTTS — the only externally reachable port ----
listener 8883 0.0.0.0
protocol mqtt
max_connections 2000
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
